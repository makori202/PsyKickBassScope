        </div>
        <button id="btnInv" class="btn-pill py-1 rounded text-[10px] font-black">180° INVERT: OFF</button>
        <button id="btnMono" class="btn-pill active py-1 rounded text-[10px] font-black">MONO SUB: ON</button>
        <button id="btnM30x" class="btn-pill py-1 rounded text-[10px] font-black">M30x +4dB: OFF</button>
      </div>

      <div class="col-span-10 flex flex-col gap-2 min-h-0">
        <div class="flex-1 bg-[#0b0416] border border-purple-700/80 rounded-lg overflow-hidden flex flex-col min-h-0">
          <div class="px-2.5 py-1 bg-[#18092e] border-b border-purple-800/80 flex justify-between text-[10px] font-bold text-amber-300">
            <span>LIVE KICK-BASS WAVEFORM + DUCKING ENVELOPE</span>
            <span id="scopeInfo" class="text-purple-200">X-OVER: 120 Hz • PHASE: 0°</span>
          </div>
          <canvas id="scopeCanvas" class="w-full flex-1 block"></canvas>
        </div>

        <div class="grid grid-cols-5 gap-1.5 shrink-0">
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>PHASE</span><span id="vPhase" class="text-amber-300">0°</span></div><input id="sPhase" type="range" min="0" max="360" value="0" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>SUB DUCK</span><span id="vSubDuck" class="text-amber-300">88%</span></div><input id="sSubDuck" type="range" min="0" max="100" value="88" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>TOP DUCK</span><span id="vTopDuck" class="text-amber-300">65%</span></div><input id="sTopDuck" type="range" min="0" max="100" value="65" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>HOLD</span><span id="vHold" class="text-amber-300">18 ms</span></div><input id="sHold" type="range" min="0" max="60" value="18" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>RELEASE</span><span id="vRel" class="text-amber-300">65 ms</span></div><input id="sRel" type="range" min="10" max="250" value="65" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>CURVE</span><span id="vCurve" class="text-amber-300">60%</span></div><input id="sCurve" type="range" min="0" max="100" value="60" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>X-OVER</span><span id="vXover" class="text-amber-300">120 Hz</span></div><input id="sXover" type="range" min="60" max="250" value="120" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>PUNCH</span><span id="vWarmth" class="text-amber-300">25%</span></div><input id="sWarmth" type="range" min="0" max="100" value="25" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70"><div class="flex justify-between text-[9px] font-bold mb-1"><span>SUB GAIN</span><span id="vSubGain" class="text-amber-300">0 dB</span></div><input id="sSubGain" type="range" min="-6" max="6" step="0.5" value="0" class="sl w-full" /></div>
          <div class="bg-[#1f0d3b] rounded p-1.5 border border-purple-800/70 flex items-center justify-center text-[9px] text-purple-300 font-bold text-center">Place on Bass Track</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const PRESETS = [
      { name:"KBBB 140", subDuck:88, topDuck:65, hold:18, rel:65, curve:60, xover:120, warmth:25 },
      { name:"Full-On",  subDuck:98, topDuck:80, hold:22, rel:55, curve:75, xover:130, warmth:30 },
      { name:"Goa Roll", subDuck:75, topDuck:45, hold:12, rel:85, curve:45, xover:110, warmth:35 },
      { name:"Dark Sub", subDuck:95, topDuck:70, hold:25, rel:70, curve:70, xover:105, warmth:45 },
      { name:"Prog Off", subDuck:60, topDuck:35, hold:8,  rel:100,curve:35, xover:125, warmth:15 },
      { name:"Hard SC",  subDuck:100,topDuck:95, hold:24, rel:60, curve:85, xover:140, warmth:30 },
    ];
    const st = { phase:0, inv:0, mono:1, m30x:0, subDuck:88, topDuck:65, hold:18, rel:65, curve:60, xover:120, warmth:25, subGain:0, preset:0 };
    let liveWave = new Array(128).fill(0), liveEnv = new Array(128).fill(1);

    function sync() {
      try { window.location.href = "https://juce.bridge/params?data=" + encodeURIComponent(JSON.stringify(st)); } catch(e) {}
    }
    window.updateScopeFromVst3 = (d) => { if(d && d.w) { liveWave = d.w; liveEnv = d.e; drawScope(); } };

    function drawScope() {
      const c = document.getElementById("scopeCanvas"), ctx = c.getContext("2d");
      const r = c.getBoundingClientRect(); if(r.width < 10) return;
      c.width = r.width; c.height = r.height;
      const W = r.width, H = r.height, mid = H * 0.5;
      ctx.fillStyle = "#0b0416"; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = "#241042"; ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(W,mid); ctx.stroke();

      // Draw Live Waveform (Purple/Cyan)
      ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 2; ctx.beginPath();
      for(let i=0; i<liveWave.length; i++) {
        const x = (i / (liveWave.length - 1)) * W;
        const y = mid - liveWave[i] * (H * 0.42);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();

      // Draw Ducking Envelope (Golden Yellow)
      ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2.5; ctx.beginPath();
      for(let i=0; i<liveEnv.length; i++) {
        const x = (i / (liveEnv.length - 1)) * W;
        const y = H - 8 - liveEnv[i] * (H - 18);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    function render() {
      document.getElementById("vPhase").textContent = st.phase + "°";
      document.getElementById("vSubDuck").textContent = st.subDuck + "%";
      document.getElementById("vTopDuck").textContent = st.topDuck + "%";
      document.getElementById("vHold").textContent = st.hold + " ms";
      document.getElementById("vRel").textContent = st.rel + " ms";
      document.getElementById("vCurve").textContent = st.curve + "%";
      document.getElementById("vXover").textContent = st.xover + " Hz";
      document.getElementById("vWarmth").textContent = st.warmth + "%";
      document.getElementById("vSubGain").textContent = st.subGain + " dB";
      document.getElementById("scopeInfo").textContent = `X-OVER: ${st.xover} Hz • PHASE: ${st.phase}°`;
      const pb = document.getElementById("presetBar"); pb.innerHTML = "";
      PRESETS.forEach((p, idx) => {
        const b = document.createElement("button");
        b.className = `btn-pill px-2 py-0.5 rounded text-[10px] font-bold ${st.preset===idx?"active":""}`;
        b.textContent = p.name;
        b.onclick = () => { Object.assign(st, p, {preset: idx}); syncInputs(); render(); sync(); };
        pb.appendChild(b);
      });
      drawScope();
    }
    function syncInputs() {
      [["sPhase","phase"],["sSubDuck","subDuck"],["sTopDuck","topDuck"],["sHold","hold"],["sRel","rel"],
       ["sCurve","curve"],["sXover","xover"],["sWarmth","warmth"],["sSubGain","subGain"]].forEach(([id,k]) => {
        document.getElementById(id).value = st[k];
      });
    }
    [["sPhase","phase"],["sSubDuck","subDuck"],["sTopDuck","topDuck"],["sHold","hold"],["sRel","rel"],
     ["sCurve","curve"],["sXover","xover"],["sWarmth","warmth"],["sSubGain","subGain"]].forEach(([id,k]) => {
      document.getElementById(id).oninput = (e) => { st[k] = parseFloat(e.target.value); render(); sync(); };
    });
    document.getElementById("btnInv").onclick = (e) => { st.inv = st.inv?0:1; e.target.textContent = "180° INVERT: " + (st.inv?"ON":"OFF"); e.target.classList.toggle("active", st.inv); sync(); };
    document.getElementById("btnMono").onclick = (e) => { st.mono = st.mono?0:1; e.target.textContent = "MONO SUB: " + (st.mono?"ON":"OFF"); e.target.classList.toggle("active", st.mono); sync(); };
    document.getElementById("btnM30x").onclick = (e) => { st.m30x = st.m30x?0:1; e.target.textContent = "M30x +4dB: " + (st.m30x?"ON":"OFF"); e.target.classList.toggle("active", st.m30x); sync(); };
    window.addEventListener("resize", drawScope);
    render();
    setTimeout(sync, 300);
  </script>
